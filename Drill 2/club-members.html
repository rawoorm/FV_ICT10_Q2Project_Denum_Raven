
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Members</title>

    <!-- PyScript Links -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.8.1/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2025.8.1/core.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f0ed;
            color: #373631;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 45px;
        }

        nav a {
            background: #ffffff;
            color: #55534e;
            padding: 12px 18px;
            border: 1px solid #dedbd5;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background: #d8d4cd;
            color: #292824;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 750px;
            margin: auto;
            padding: 45px;
            background: #ffffff;
            border: 1px solid #e3e0db;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(50, 45, 40, 0.06);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-icon {
            width: 85px;
            height: 85px;
            background: #e5e2dc;
            color: #625e57;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }

        h2 {
            color: #35332f;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #89857f;
            font-size: 14px;
            line-height: 1.7;
        }

        /* Form Section */
        .form-section {
            background: #f7f6f3;
            border: 1px solid #e7e4df;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #504c46;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #dedbd5;
            border-radius: 8px;
            outline: none;
            background: #ffffff;
            color: #373631;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        input::placeholder {
            color: #a39c91;
        }

        input:focus {
            border-color: #a39c91;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #d8d4cd;
            color: #373631;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c5bfb5;
        }

        /* Success Message */
        #message {
            margin-top: 15px;
            color: #476b4b;
            font-size: 14px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        /* Members Results */
        .results {
            background: #f7f6f3;
            border: 1px solid #e7e4df;
            border-radius: 12px;
            padding: 25px;
        }

        .results h3 {
            font-size: 19px;
            color: #504c46;
            margin-bottom: 15px;
        }

        #members {
            white-space: pre-wrap;
            line-height: 1.9;
            color: #6a665f;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        #total {
            font-weight: bold;
            margin-top: 18px;
            color: #504c46;
            font-size: 14px;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 30px;
            color: #89857f;
            font-size: 12px;
        }

        /* Mobile Design */
        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 24px;
            }

            .form-section,
            .results {
                padding: 20px;
            }

            nav a {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Student Showcase Navigation -->
    <nav>
        <a href="../Seatwork 1/index.html">🏠 Home</a>
        <a href="../Skills test/element-checker.html">⚛️ Element Checker</a>
        <a href="club-members.html">👥 Club Members</a>
        <a href="../Meet the creator/meet-the-creator.html">Meet the Creator</a>
    </nav>

    <!-- Main Content -->
    <main class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-icon">👥</div>

            <h2>Add New Club Member</h2>

            <p class="subtitle">
                Enter the information below to add a new
                member to the ICT Club.
            </p>
        </div>

        <!-- Member Registration -->
        <div class="form-section">

            <label for="first_name">First Name</label>
            <input
                type="text"
                id="first_name"
                placeholder="First Name"
            >

            <label for="last_name">Last Name</label>
            <input
                type="text"
                id="last_name"
                placeholder="Last Name"
            >

            <button py-click="add_member">
                Submit
            </button>

            <p id="message"></p>

        </div>

        <!-- Members List -->
        <div class="results">
            <h3>All Members</h3>

            <div id="members"></div>

            <p id="total"></p>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>Student Showcase 2026 | ICT Club Members</p>
    </footer>

    <!-- Python Connection -->
    <script type="py" src="./club.py"></script>

</body>
</html>
