
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT | Candidate Verification System</title>

    <!-- PyScript Links -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.8.1/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2025.8.1/core.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 30px 20px;
            background: #f1f0ed;
            color: #373631;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            background: #ffffff;
            color: #55534e;
            padding: 12px 18px;
            border: 1px solid #dedbd5;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background: #d8d4cd;
            color: #292824;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e3e0db;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(50, 45, 40, 0.06);
        }

        /* ICT Logo */
        .logo {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 12px;
            background: #e5e2dc;
            color: #625e57;
            font-size: 18px;
            font-weight: 700;
        }

        /* Membership Tag */
        .tag {
            display: inline-block;
            margin-bottom: 12px;
            color: #89857f;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        h1 {
            margin-bottom: 12px;
            color: #35332f;
            font-size: 26px;
            line-height: 1.35;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #89857f;
            font-size: 14px;
            line-height: 1.7;
        }

        /* Input Fields */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #504c46;
            font-size: 13px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dedbd5;
            border-radius: 8px;
            outline: none;
            background: #f7f6f3;
            color: #373631;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        input::placeholder {
            color: #a39c91;
        }

        input:focus {
            border-color: #a39c91;
            background: #ffffff;
        }

        /* Verify Button */
        button {
            width: 100%;
            margin-top: 4px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #d8d4cd;
            color: #373631;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c5bfb5;
        }

        /* Verification Result */
        .result {
            margin-top: 22px;
            padding: 15px;
            border: 1px solid #e7e4df;
            border-radius: 8px;
            background: #f7f6f3;
            color: #6a665f;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .result::before {
            content: "VERIFICATION STATUS";
            display: block;
            margin-bottom: 6px;
            color: #89857f;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Successful Verification */
        .result.success {
            border-color: #9cae9b;
            background: #edf2eb;
            color: #476b4b;
        }

        .result.success::before {
            content: "✓ ACCESS GRANTED";
            color: #476b4b;
        }

        /* Failed Verification */
        .result.error {
            border-color: #c9a5a0;
            background: #f7eeec;
            color: #93534d;
        }

        .result.error::before {
            content: "✕ ACCESS DENIED";
            color: #93534d;
        }

        /* Warning Message */
        .result.warning {
            border-color: #d2c29b;
            background: #f8f3e8;
            color: #8a7549;
        }

        .result.warning::before {
            content: "⚠ SYSTEM NOTICE";
            color: #8a7549;
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            color: #89857f;
            font-size: 10px;
            line-height: 1.8;
            text-align: center;
        }

        .footer span {
            color: #504c46;
            font-weight: 700;
        }

        /* Mobile Design */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }

            nav a {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="../Skills test/element-checker.html">⚛️ Element Checker</a>
        <a href="../Drill 2/club-members.html">👥 Club Members</a>
        <a href="../Meet the creator/meet-the-creator.html">Meet the Creator</a>
    </nav>

    <!-- Candidate Verification System -->
    <main class="container">

        <div class="logo">ICT</div>

        <div class="tag">MEMBERSHIP PORTAL</div>

        <h1>Candidate Verification System</h1>

        <p class="subtitle">
            Welcome, candidate! Enter your name below
            to verify your ICT Club membership status.
        </p>

        <form id="verification-form">

            <div class="form-group">
                <label for="first-name">First Name</label>
                <input
                    type="text"
                    id="first-name"
                    placeholder="Enter your first name"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input
                    type="text"
                    id="last-name"
                    placeholder="Enter your last name"
                    autocomplete="family-name"
                    required
                >
            </div>

            <button
                id="verify-btn"
                type="button"
                py-click="check_name"
            >
                Verify Membership
            </button>

        </form>

        <div id="result" class="result" aria-live="polite">
            Awaiting candidate information...
        </div>

        <p class="footer">
            POWERED BY <span>ICT CLUB</span>
            CANDIDATE PORTAL · SYSTEM V1.0
        </p>

    </main>

    <!-- Python Connection -->
    <script type="py" src="./main.py"></script>

</body>
</html>
